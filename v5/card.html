<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voke</title>
<style>
  /* Voke card. Tokens follow the host's light/dark scheme. */
  :root{
    color-scheme:light dark;
    --vk-back:light-dark(#f0f0ef,#232625);
    --vk-bg:light-dark(#ffffff,#1c1e22);
    --vk-tx:light-dark(#212121,#f4f2f0);
    --vk-tx2:light-dark(#2d3748,#d5d8de);
    --vk-tx3:light-dark(#4a5568,#a9b2c0);
    --vk-line:light-dark(#e2e8f0,rgba(255,255,255,.08));
    --vk-field:var(--vk-pick); /* one fill everywhere: the search bar color */
    --vk-search:var(--vk-pick);
    --vk-hover:light-dark(rgba(33,33,33,.05),#232625);
    --vk-ring:light-dark(rgba(33,33,33,.14),rgba(255,255,255,.16));
    --vk-sel:light-dark(#f4f2f0,#2b2e35);
    --vk-ok:light-dark(#edf7f0,#1f2b24);
    --vk-sel-ring:light-dark(rgba(33,33,33,.12),rgba(255,255,255,.18));
    --vk-inv:light-dark(#212121,#f4f2f0);
    --vk-inv-tx:light-dark(#ffffff,#212121);
    --vk-focus:var(--vk-cta-ink);
    --vk-brand:#dfff72;
    /* Copied banner: the logo's chartreuse */
    --vk-done:var(--vk-brand);
    --vk-done-tx:var(--vk-brand-tx);
    /* State color: ink black (light) / off-white (dark) for selection, progress, saved state and focus; brand blue is the logo */
    --vk-cta:light-dark(#212121,#f4f2f0);
    --vk-cta-ink:light-dark(#212121,#f4f2f0);
    --vk-cta-soft:light-dark(#e9e7e4,#3a3e47);
    --vk-cta-soft-tx:light-dark(#212121,#f4f2f0);
    --vk-brand-tx:#172118;
    --vk-star:light-dark(#b7791f,#f4d35e);
    --vk-name:light-dark(#212121,#f7f6f4);
    --vk-desc:light-dark(#2d3748,#ccd1d9);
    --vk-meta:light-dark(#4a5568,#a9b2c0);
    --vk-pick:light-dark(#f0f0ef,#232625);
    --vk-icon:light-dark(#4a5568,#a9b2c0);
    --vk-pill-on:var(--vk-cta);
    --vk-pill-bd:light-dark(#e2e8f0,rgba(255,255,255,.08));
    --vk-pill-line:light-dark(#a0aec0,rgba(255,255,255,.22));
    --vk-track:light-dark(#e2e8f0,#3a3e47);
    --vk-font:system-ui,-apple-system,"SF Pro Text","Segoe UI",sans-serif;
    /* legacy names used by the recipe view */
    --vk-bg2:var(--vk-field);--vk-ghost:var(--vk-hover);--vk-bd:var(--vk-ring);--vk-bd2:var(--vk-line);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;background:transparent;font-family:var(--vk-font);color:var(--vk-tx);-webkit-font-smoothing:antialiased}
  button,input{font:inherit;color:inherit}
  button{appearance:none;-webkit-appearance:none;border:0;background:none;padding:0;margin:0;cursor:pointer;line-height:1}
  svg{display:block;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  button:focus-visible,.skill:focus-visible{outline:2px solid var(--vk-focus);outline-offset:2px}

  /* Card: mobile type and spacing on every screen; width fills the chat column */
  /* Phones render the card edge to edge, so give it a side gutter there */
  @media (max-width:600px){body{padding:0 12px}}
  .back{background:var(--vk-back);border-radius:22px;padding:9px}
  .shell{background:var(--vk-bg);border:1px solid var(--vk-pill-bd);border-radius:18px;overflow:hidden;padding:10px 10px 0;display:flex;flex-direction:column;gap:10px}

  /* Header */
  .head{display:flex;align-items:center;gap:9px}
  .mark{width:36px;height:36px;border-radius:10px;background:var(--vk-brand);color:var(--vk-brand-tx);display:grid;place-items:center;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1;flex:none}
  .logo{width:36px;height:36px;border-radius:50%;background:var(--vk-brand);color:var(--vk-brand-tx);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none;text-transform:lowercase;line-height:1;padding-bottom:2px}
  .field{flex:1;min-width:0;display:flex;align-items:center;height:36px;padding:0 12px;border-radius:10px;background:var(--vk-search);cursor:text}
  .field:focus-within{outline:none}
  .search{flex:1;min-width:0;height:36px;border:0;outline:0;padding:0;margin:0;background:transparent;box-shadow:none;border-radius:0;-webkit-appearance:none;appearance:none;font-size:15px;color:var(--vk-name)}
  .search::placeholder{color:var(--vk-tx3);opacity:1}
  .search::-webkit-search-cancel-button{display:none}
  .dots{flex:none;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:var(--vk-bg);display:grid;place-items:center;line-height:0;color:var(--vk-icon)}
  .dots[aria-expanded=true]{background:var(--vk-pick)}
  @media (hover:hover){.dots:hover{background:var(--vk-pick)}}
  .dots:focus{outline:none}
  .dots:focus-visible{outline:2px solid var(--vk-icon);outline-offset:2px}
  .dots svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  /* Header buttons: + (brand), light/dark, menu. Rounded squares, the same 36px as the logo and search bar. */
  .dots,.hb{box-shadow:inset 0 0 0 1px var(--vk-ring)}
  .hb{flex:none;width:36px;height:36px;padding:0;border:0;border-radius:10px;background:var(--vk-bg);display:grid;place-items:center;line-height:0;color:var(--vk-icon);cursor:pointer}
  .hb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  @media (hover:hover){.hb:hover{background:var(--vk-pick)}}
  .hb:focus{outline:none}
  .hb:focus-visible{outline:2px solid var(--vk-icon);outline-offset:2px}
  .hb.add{background:var(--vk-brand);color:var(--vk-brand-tx);box-shadow:none}
  @media (hover:hover){.hb.add:hover{filter:brightness(.95)}}
  .hb.add svg{stroke-width:2.2}
  .hb .moon{display:none}
  :root[data-theme=dark] .hb .sun{display:none}
  :root[data-theme=dark] .hb .moon{display:block}
  .dots .x{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;display:none}
  .dots[aria-expanded=true] .d{display:none}
  .dots[aria-expanded=true] .x{display:block}

  /* Menu */
  .menu{padding:8px;border-radius:12px;background:var(--vk-pick)}
  .menu[hidden]{display:none}
  .menu button{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:8px;font-size:15px;text-align:left;line-height:1.2}
  .menu button:hover{background:var(--vk-hover)}
  .menu svg{width:19px;height:19px}
  .menu hr{border:0;border-top:1px solid var(--vk-line);margin:8px 0}
  .menu .n{margin-left:auto;color:var(--vk-tx3);font-variant-numeric:tabular-nums}

  /* Category pills + active filters */
  .cats{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none;white-space:nowrap}
  .cats::-webkit-scrollbar{display:none}
  .cats.overflow{-webkit-mask-image:linear-gradient(90deg,#000 90%,transparent);mask-image:linear-gradient(90deg,#000 90%,transparent)}
  .cats.overflow.end{-webkit-mask-image:none;mask-image:none}
  .cats button{flex:none;padding:6px 14px;border-radius:100px;border:1px solid var(--vk-pill-line);font-size:12px;font-weight:500;line-height:1.2;color:var(--vk-tx2);white-space:nowrap}
  .cats button:hover{color:var(--vk-name)}
  .cats button.on{background:var(--vk-pill-on);border-color:transparent;color:var(--vk-inv-tx);font-weight:600}
  .filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .filters:empty{display:none}
  .chip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 12px;border-radius:15px;background:var(--vk-inv);color:var(--vk-inv-tx);font-size:13px;font-weight:500}
  .chip button{display:grid;place-items:center;width:24px;height:24px;border-radius:12px;opacity:.75}
  .chip button:hover{opacity:1;background:rgba(127,127,127,.25)}
  .chip svg{width:12px;height:12px;stroke-width:2.5}

  /* Skill list */
  .list{height:384px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--vk-line) transparent}
  .list::-webkit-scrollbar{width:6px}
  .list::-webkit-scrollbar-thumb{background:var(--vk-line);border-radius:3px}
  .skill{position:relative;display:grid;grid-template-columns:20px 1fr 32px;column-gap:12px;align-items:start;border-radius:10px;padding:10px 8px 10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .skill+.skill{margin-top:2px}
      .skill.on{background:var(--vk-pick)}
  .skill[data-busy]{opacity:.6}
  .top{display:contents}
  .body{min-width:0;display:flex;flex-direction:column;gap:2px}
  .si{width:20px;height:20px;margin-top:1px;display:grid;place-items:center;color:var(--vk-icon)}
  .on .si{color:var(--vk-icon)}
  .si svg{width:18px;height:18px}
  .name{font-size:15px;font-weight:500;line-height:1.3;color:var(--vk-name);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .save{grid-column:3;grid-row:1;align-self:center;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--vk-meta)}
  .save:hover{background:var(--vk-field)}
  .save svg{width:17px;height:17px}
  .save.saved{color:var(--vk-cta-ink)}
  .save.saved svg{fill:currentColor}
  .desc{margin:0;font-size:13px;line-height:1.4;color:var(--vk-desc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .by{display:flex;align-items:center;gap:6px;font-size:13px;line-height:1.4;color:var(--vk-meta)}
  .by strong{font-weight:500}
  .creator{font-weight:500;color:inherit;line-height:inherit;border-radius:4px}
  .creator:hover{color:var(--vk-name);text-decoration:underline;text-underline-offset:2px}
  .star{display:flex;align-items:center;gap:3px;padding:0 4px;margin:0 -4px;border-radius:6px;font-size:13px;color:inherit;font-variant-numeric:tabular-nums}
  .star svg{width:13px;height:13px}
  .star.starred svg{fill:var(--vk-star);stroke:var(--vk-star)}
  .empty{padding:24px;text-align:center;font-size:14px;line-height:1.5;color:var(--vk-tx3)}
  .empty b{color:var(--vk-tx);font-weight:600}
  .acts{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
  .btn{height:36px;padding:0 16px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--vk-ring);font-size:14px;font-weight:500}
  .btn:hover{background:var(--vk-hover)}
  .btn.primary{background:var(--vk-inv);color:var(--vk-inv-tx);box-shadow:none}
  .note{margin:8px 0;padding:12px;border-radius:10px;background:var(--vk-field);font-size:14px;color:var(--vk-tx2)}
  .note.ok{background:var(--vk-done);color:var(--vk-done-tx);display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.4}
  .note.ok .ck{width:17px;height:17px;border-radius:50%;background:none;border:1.8px solid currentColor;color:var(--vk-done-tx);display:grid;place-items:center;flex:none;margin-top:1px}
  .note.ok .ck svg{width:11px;height:11px;stroke-width:3.2}
  .note.ok b.t{display:block;font-size:14px;color:var(--vk-done-tx);margin-bottom:4px}
  .note code{font-family:ui-monospace,monospace;color:var(--vk-tx)}
  .note input.cmd{display:block;width:100%;margin-top:8px;font-family:ui-monospace,monospace;font-size:13px;box-sizing:border-box}
  .more{padding:10px;text-align:center;font-size:13px;color:var(--vk-tx3)}
  .sk{display:flex;align-items:center;gap:12px;padding:16px 12px;margin:2px 0}
  .sk i{display:block;height:13px;border-radius:7px;background:var(--vk-field);animation:pulse 1.1s ease-in-out infinite alternate}
  .sk i:first-child{width:20px;height:20px;border-radius:6px;flex:none}
  @keyframes pulse{to{opacity:.5}}
  .foot{display:none}
  /* Phones: the Claude iOS app keeps vertical swipes for the chat (the list never scrolls up and down inside
     the card, and JS-driven scrolling lags), but sideways swipes reach the card: the category pills scroll
     natively. So on phones the skills sit on pages of 5 that swipe sideways, with a scroll bar and page numbers underneath. */
  .vk-pages .list.paged{height:auto;touch-action:auto;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;overscroll-behavior-x:contain;scrollbar-width:none}
  .vk-pages .list.paged::-webkit-scrollbar{display:none}
  .pg{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
  .vk-pages .list:not(.paged){height:auto;min-height:200px}
  .vk-pages .static .list{max-height:none;overflow:visible}
  .pager{display:flex;flex-direction:column;gap:2px;padding:0 0 8px}
  .pager[hidden]{display:none}
  /* No pager underneath (one page, or desktop): keep the last skill off the card's bottom edge */
  .shell:has(> .pager[hidden]){padding-bottom:10px}
  /* Scroll bar: thumb sized to one page, follows the swipe; drag it or tap the track */
  .bar{position:relative;height:18px;margin:0 4px;touch-action:none;cursor:pointer}
  .bar::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;border-radius:1px;background:var(--vk-track)}
  .thumb{position:absolute;left:0;top:7.5px;height:3px;border-radius:1.5px;background:var(--vk-cta-ink);min-width:24px;will-change:transform}
  .bar.dragging .thumb{top:7px;height:4px;border-radius:2px}
  /* Page numbers */
  /* Arrows pinned to the edges; the numbers between them change without moving the arrows */
  .nums{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;gap:4px;font-size:13px;font-variant-numeric:tabular-nums}
  .nums .pn{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
  .nums button{min-width:32px;height:32px;padding:0 6px;border-radius:8px;color:var(--vk-desc)}
  .nums button.on{background:var(--vk-cta-soft);color:var(--vk-cta-soft-tx);font-weight:600}
  .nums button:disabled{opacity:.35;cursor:default}
  .nums .gap{min-width:18px;text-align:center;color:var(--vk-tx3)}
  .nums svg{width:16px;height:16px;margin:0 auto}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* Recipe card, repo chooser and status line (GitHub to Skill, running skill) */
  .rc{padding:14px 16px 12px}
  .rc h2{margin:0;font-size:15px;font-weight:600;line-height:1.3}
  .rc .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--vk-tx3)}
  .pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;background:var(--vk-ghost);color:var(--vk-tx2);font-size:12px;white-space:nowrap}
  .pill.ok{background:light-dark(#e3f3e8,#1f3a2a);color:light-dark(#1d6b3a,#8fd6a8)}
  .pill.warn{background:light-dark(#fbefd9,#3d3020);color:light-dark(#8a5a12,#e6c07d)}
  .rc .d{margin:10px 0 0;font-size:13px;color:var(--vk-tx2);line-height:1.45}
  .rc h3{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--vk-tx3);text-transform:uppercase;letter-spacing:.04em}
  .steps{margin:0;padding:0;list-style:none;counter-reset:st}
  .steps li{counter-increment:st;display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--vk-bd2);font-size:13px}
  .steps li:first-child{border-top:0}
  .steps li::before{content:counter(st);flex-shrink:0;width:20px;height:20px;border-radius:10px;background:var(--vk-ghost);display:grid;place-items:center;font-size:12px;color:var(--vk-tx2);font-variant-numeric:tabular-nums}
  .steps .t{flex:1;min-width:0}
  .steps .tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .kv{font-size:13px;color:var(--vk-tx2);line-height:1.5}
  .kv b{color:var(--vk-tx);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:4px}
  .rc .acts{justify-content:flex-start;margin-top:14px}
  .rc .why{margin-top:4px;font-size:12px;color:var(--vk-tx3)}
  .row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px}
  .row .body{flex:1;min-width:0}
  .row .top{min-height:0;gap:8px}
  .row .desc{margin:3px 0 0;font-size:13px;line-height:1.4;color:var(--vk-tx2)}
  .use{flex-shrink:0;height:30px;padding:0 14px;border-radius:8px;border:1px solid var(--vk-bd);background:var(--vk-bg);font-size:13px;font-weight:500}
  .use:hover{background:var(--vk-inv);color:var(--vk-inv-tx);border-color:transparent}
  .use:disabled{opacity:.6;cursor:default}
  .status{display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:13px;color:var(--vk-tx2)}
  .status b{color:var(--vk-tx);font-weight:600}
  svg.vmark{width:19px;height:19px;max-width:none;max-height:none;fill:currentColor;stroke:none;overflow:visible}
  .status .logo svg.vmark{width:11px;height:11px}
  .logo:has(svg.vmark){padding-bottom:0}
  .status .logo{width:22px;height:22px;font-size:12px}
  .shell.solo{padding:10px}
  .static .list{height:auto;max-height:420px}
  body.hidden .shell{display:none}
  @media (prefers-reduced-motion:reduce){.sk i{animation:none}}

  /* Skill page: opened from a skill's Details button. Stacked on desktop; on touch screens the top stays put
     and the sections below swipe sideways as pages (the chat keeps vertical swipes). */
  .bk{display:none}
  .detailing .bk{display:grid}
  .detailing #cats,.detailing #filters,.detailing #list,.detailing #pager,.detailing #menu{display:none}
  .dt[hidden]{display:none}
  .dt{display:flex;flex-direction:column;gap:10px;padding:0 2px 12px}
  .dt-hero{display:grid;column-gap:12px;align-items:start}
  .dt-ic{width:44px;height:44px;border-radius:12px;background:var(--vk-search);display:grid;place-items:center;color:var(--vk-icon)}
  .dt-ic svg{width:22px;height:22px}
  .dt-t{margin:0;font-size:19px;font-weight:600;line-height:1.25;color:var(--vk-name)}
  .dt-hero .by{margin-top:3px}
  .dt-d{margin:0;font-size:14px;line-height:1.5;color:var(--vk-desc)}
  .dt-pills{display:flex;flex-wrap:wrap;gap:6px}
  .dt-pills .pill{height:22px;padding:0 9px;border-radius:11px;background:var(--vk-search);color:var(--vk-desc)}
  .dt-run{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;border-radius:12px;background:var(--vk-inv);color:var(--vk-inv-tx);font-size:15px;font-weight:600}
  .dt-run svg{width:15px;height:15px;fill:currentColor;stroke:none}
  .dt .note.ok{margin:0}
  .dt-sec{border-top:1px solid var(--vk-line);padding-top:12px}
  .dt-h{margin:0 0 8px 2px;font-size:12px;font-weight:600;color:var(--vk-tx3)}
  .dt-sec>.dt-h:not(:first-child){margin-top:16px}
  .dt-it{padding:4px 2px;font-size:14px;line-height:1.5;color:var(--vk-desc)}
  .dt-cell{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;margin-bottom:6px;border-radius:10px;background:var(--vk-search);font-size:14px;color:var(--vk-name)}
  .dt-cell span:first-child{font-size:13px;color:var(--vk-meta);flex:none}
  .dt-cell span:last-child{text-align:right}
  .dt-st{display:flex;gap:10px;padding:6px 2px;font-size:14px;line-height:1.4;color:var(--vk-desc)}
  .dt-st b{width:20px;height:20px;border-radius:10px;background:var(--vk-search);display:grid;place-items:center;font-size:12px;font-weight:400;flex:none;font-variant-numeric:tabular-nums}
  .dt-mono{font-family:ui-monospace,monospace}
  .dt-sub{margin:8px 2px 0;font-size:12px;color:var(--vk-meta)}
  .dt-kv{display:flex;justify-content:space-between;gap:12px;padding:7px 2px;font-size:14px;color:var(--vk-desc);border-bottom:1px solid var(--vk-line)}
  .dt-kv:last-child{border-bottom:0}
  .dt-kv span:first-child{color:var(--vk-meta)}
  .dt-kv a{color:inherit;text-decoration:underline;text-underline-offset:2px}
  .dt-rel .skill.on{background:var(--vk-pick)}
  @media (hover:hover){.dt-rel .skill:hover{background:var(--vk-pick)}}
  .dt-wait{height:13px;border-radius:7px;background:var(--vk-search);margin:8px 2px;animation:pulse 1.1s ease-in-out infinite alternate}
  .info{display:flex;align-items:center;gap:3px;font-size:13px;color:inherit;padding:0 4px;margin:0 -4px;border-radius:6px}
  .info svg{width:14px;height:14px}
  .info:hover{color:var(--vk-name)}
  /* Wide screens: hero across the top with Run skill beside the title; reading column plus a facts column */
  .dt-top{display:flex;flex-direction:column;gap:10px}
  .dt-hero{grid-template-columns:44px 1fr auto}
  .dt-acts{display:flex;align-items:center;gap:6px}

  }
  .vk-pages .skill.pl,.dt-rel .skill.pl{grid-template-columns:64px minmax(0,1fr) auto auto!important;column-gap:10px!important}
  .vk-pages .pl .cov,.dt-rel .pl .cov{width:64px;height:43px}.vk-pages .prun,.dt-rel .prun{width:34px!important;height:34px!important;padding:0!important;border-radius:50%!important;justify-content:center;background:var(--vk-inv)!important;color:var(--vk-inv-tx)!important;box-shadow:none!important}.vk-pages .prun span,.dt-rel .prun span{display:none}

  /* V5 shapes: round logo, pill search, round header buttons, pill Run play. */
  .head .mark,.head .hb,.head .dots{border-radius:50%}

    --vk-name:light-dark(#212121,#FFFFFF);

  :root{--vk-search:light-dark(#f0f0ef,#2A2A2A);--vk-chip:light-dark(#f0f0ef,#2A2A2A);--vk-chip-line:transparent;--vk-btn:light-dark(#f0f0ef,#2A2A2A);--vk-btn-hov:light-dark(#e6e5e2,#333333)}

<script>
(function () {

  var PAGE = 20;
  // Touch screens page the list sideways (see the .vk-pages styles); PER skills to a page.
  var paged = matchMedia("(hover:none) and (pointer:coarse)").matches, PER = 5;
  document.documentElement.classList.toggle("vk-pages", paged);
  var $ = function (id) { return document.getElementById(id); };
  var q = $("q"), list = $("list"), filters = $("filters"), cats = $("cats"), menu = $("menu"), count = $("count");

  // ------------------------------------------------------------ MCP Apps bridge (JSON-RPC over postMessage)
  var nextId = 1, pending = {}, ready = false;
  function post(msg) { window.parent.postMessage(Object.assign({ jsonrpc: "2.0" }, msg), "*"); }
  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending[id] = { resolve: resolve, reject: reject };
      post({ id: id, method: method, params: params || {} });

    });

  function notify(method, params) { post({ method: method, params: params || {} }); }

  window.addEventListener("message", function (e) {

      keys.forEach(function (k) { if (b[k] && (!d[k] || PF.auto[k])) { d[k] = b[k]; PF.auto[k] = 1; } if (b[k]) got.push(k); });
      if (b.colors && b.colors.length && (!d.colors.length || PF.auto.colors)) { d.colors = b.colors.slice(0, 6); PF.auto.colors = 1; }
      if (b.colors && b.colors.length) got.push("colors");
      var core = got.filter(function (k) { return k !== "icp" && k !== "competitors"; }).length;
      PF.status = "Filled " + core + " of 5 from your site. Everything stays editable.";
      rr();
    }).catch(function () { if (PF.last === u) { PF.busy = false; PF.status = "Couldn't read the site. Fill in the steps yourself."; rr(); } });
  }
  // Re-render without kicking the cursor out of the website field.
  function rr() {
    var f = document.activeElement && document.activeElement.id === "pfWeb";
    PF.rendering = true; renderProfile(); PF.rendering = false;
    var w = $("pfWeb"); if (f && w) { w.focus(); w.setSelectionRange(w.value.length, w.value.length); }
  }
  function openLink(url) {
    request("ui/open-link", { url: url }).catch(function () { try { window.open(url, "_blank", "noopener"); } catch (e) {} });
  }
  // Connecting goes through the user's own Composio connector in chat: Claude runs it and the user approves.
  function connectMsg(name, prof) { return "Use Composio to connect " + name + " for my " + prof + " profile in Voke."; }
  function connectForProfile(id) {
    var a = APPS_LIST.filter(function (x) { return x.id === id; })[0]; if (!a || PF.apps.indexOf(id) > -1) return;
    PF.apps.push(id);
    send(connectMsg(a.name, (PF.d.name || "").trim() || "new")).catch(function () {});
  }
  var HELP = {
    name: function (d) { return "Help me name my business" + (d.description ? ": " + d.description : "") + ". Give 5 short options with a line on each."; },
    description: function (d) { return "Write a one or two sentence description of my business " + (d.name || "") + (d.website ? " (" + d.website + ")" : "") + " for my Voke profile."; },
    logo: function (d) { return "Help me design a logo for " + (d.name || "my business") + (d.description ? " (" + d.description + ")" : "") + ": write a short brief, then give me the logo as an SVG."; },
    colors: function (d) { return "Suggest brand colors (3-4 hex codes) for " + (d.name || "my business") + (d.description ? ": " + d.description : "") + ", with a line on each."; },
    font: function (d) { return "Suggest a brand font (a free Google Font) for " + (d.name || "my business") + " and say why."; },
    icp: function (d) { return "Help me write the ideal customer description for " + (d.name || "my business") + (d.website ? " (" + d.website + ")" : "") + (d.description ? ": " + d.description : "") + ". Keep it to 2-3 sentences for my Voke profile."; },
    competitors: function (d) { return "Find the top 3-5 competitors of " + (d.name || "my business") + (d.website ? " (" + d.website + ")" : "") + (d.description ? ": " + d.description : "") + ". List them with their websites."; }
  };
  pfEl.addEventListener("click", function (e) {
    var t = e.target, d = PF.d;
    var pt = t.closest("[data-ptype]"); if (pt) { d.type = pt.dataset.ptype; renderProfile(); return; }
    var hp = t.closest("[data-help]"); if (hp) { e.preventDefault(); send(HELP[hp.dataset.help](d)).catch(function () {}); return; }
    if (t.closest("[data-addcolor]")) { d.colors.push("#191919"); renderProfile(); return; }
    var rc = t.closest("[data-rmcolor]"); if (rc) { e.preventDefault(); d.colors.splice(Number(rc.dataset.rmcolor), 1); renderProfile(); return; }
    if (t.closest("#pfCz")) { openLink(COMPOSIO_ADD); PF.czPending = true; renderProfile(); return; }
    if (t.closest("#pfCzHave") || t.closest("#pfCzDone")) { d.composio = true; PF.czPending = false; renderProfile(); return; }
    if (t.closest("#pfCzUndo")) { d.composio = false; renderProfile(); return; }
    var pa = t.closest("[data-pfapp]"); if (pa) { connectForProfile(pa.dataset.pfapp); renderProfile(); return; }
    if (t.closest("#pfApps")) { PF.hold = true; pfEl.hidden = true; $("card").classList.remove("profiling"); openApps(); return; }
    if (t.closest("#pfCancel")) { closeProfile(); return; }
    if (t.closest("#pfSave")) { saveProfile(); return; }
    if (t.closest("#pfDel")) {
      var all = profiles().filter(function (x) { return x !== PF.orig; }); store("voke-profiles", all);
      if (curProfile() === PF.orig || all.indexOf(curProfile()) < 0) store("voke-profile", all[0]);
      closeProfile(); paintAvatar(); pushProfile(); return;
    }
  });


  // ------------------------------------------------------------ sizing
  var lastH = -1;
  // The list shows whole rows only: its height ends right under the 5th row, so no half row and no white
  // strip sit at the bottom of the card. More rows are still a scroll away.
  function fitList() {
    if (paged || PG.open || list.offsetParent === null || list.closest(".static")) return;
    var rows = list.querySelectorAll(".skill");
    if (rows.length <= 5) { if (list.style.height) list.style.height = ""; return; }
    var top = list.getBoundingClientRect().top - list.scrollTop, r = rows[4].getBoundingClientRect();
    var want = Math.ceil(r.bottom - top) + "px";
    if (list.style.height !== want) list.style.height = want;
  }
  function size() {
    fitList();
    var hgt = document.body.classList.contains("hidden") ? 0 : Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (ready && hgt !== lastH) {
      lastH = hgt;
      notify("ui/notifications/size-changed", { width: Math.ceil(document.documentElement.getBoundingClientRect().width), height: hgt });
    }
  }
  if (window.ResizeObserver) new ResizeObserver(size).observe(document.body);

  // ------------------------------------------------------------ start
  draw();
  request("ui/initialize", {
    appInfo: { name: "Voke", version: "0.4.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
    protocolVersion: "2026-01-26"
  }).then(function (res) {
    applyContext(res && res.hostContext);
    lastH = -1; ready = true;
    notify("ui/notifications/initialized", {});
    size(); pushProfile();
  }).catch(function () { if (!ready) { ready = true; notify("ui/notifications/initialized", {}); } size(); });
  // Some hosts answer initialize late or not at all; don't leave the card at zero height meanwhile.
  setTimeout(function () { if (!ready) { ready = true; size(); } }, 1500);
})();
</script>
