#voke-v2 .create-fields .v-field{font-size:13px;color:var(--v-text);margin-bottom:18px;gap:8px}#voke-v2 .create-fields .v-input,#voke-v2 .create-source .v-input{font-size:15px;border-radius:12px;padding:13px;background:var(--v-bg);color:var(--v-text)}#voke-v2 .create-fields textarea.v-input{min-height:125px;resize:vertical}
#voke-v2 .create-price-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#voke-v2 .create-review-heading{display:flex;align-items:center;justify-content:space-between;gap:15px}#voke-v2 .create-edit{display:flex;align-items:center;gap:7px;background:none;border:0;color:var(--v-muted);font-size:12px;cursor:pointer;white-space:nowrap}
#voke-v2 .create-product-review .v-save{display:none}#voke-v2 .create-review-price{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px 0;border-top:1px solid var(--v-line);border-bottom:1px solid var(--v-line)}#voke-v2 .create-review-price span{font-weight:600;font-size:20px}#voke-v2 .create-review-price small{color:var(--v-muted);font-size:12px}
#voke-v2 .create-approval{border-top:1px solid var(--v-line);margin-top:28px;padding-top:22px}#voke-v2 .create-test-row{display:flex;align-items:center;justify-content:space-between;gap:20px}#voke-v2 .create-test-row strong{font-size:15px;font-weight:500}#voke-v2 .create-test-row p{font-size:13px;color:var(--v-muted);line-height:1.5;margin-top:4px}#voke-v2 .create-test-row .v-secondary{width:auto;flex:none;min-width:140px}
#voke-v2 .create-copy-status{font-size:12px;color:var(--v-muted);line-height:1.5;margin-top:10px;min-height:0}#voke-v2 .create-manual{margin-top:10px;min-height:170px;font-size:14px}#voke-v2 .create-approve{display:flex;gap:11px;align-items:flex-start;font-size:13px;margin-top:20px;line-height:1.6;cursor:pointer}#voke-v2 .create-approve input{width:19px;height:19px;flex:none;margin:1px 0 0;accent-color:var(--v-active)}
#voke-v2 .create-bottom{margin-top:20px;border-top:1px solid var(--v-line);padding:14px 2px 10px;background:var(--v-bg)}#voke-v2 #create-status{color:#ef9b91;font-size:13px;line-height:1.5;min-height:0;margin:0 0 12px}#voke-v2[data-theme=light] #create-status{color:#9c322b}#voke-v2 #create-status:empty{display:none}
#voke-v2 .create-bottom-actions{display:flex;align-items:center;gap:18px}#voke-v2 .create-back{display:flex;align-items:center;gap:7px;min-height:44px;background:none;border:0;color:var(--v-muted);cursor:pointer;font-size:13px}#voke-v2 .create-progress{font-size:12px;color:var(--v-muted);margin-left:auto}#voke-v2 .create-continue{width:auto;min-width:210px;min-height:48px;border-radius:14px;font-size:14px}
@container vpreview (width < 688px){
#voke-v2[data-view=add] .v-main{padding:12px 14px 24px}#voke-v2 .create-steps{margin-bottom:20px;padding:4px;gap:1px}#voke-v2 .create-steps button{min-height:37px;font-size:11px;padding:8px 3px;gap:3px;letter-spacing:-.15px}#voke-v2 .create-step-number,#voke-v2 .create-steps button svg{display:none}
#voke-v2 .create-heading h1{font-size:23px}#voke-v2 .create-heading p{font-size:12px}#voke-v2 .create-pane.is-current{min-height:calc(100dvh - 350px)}#voke-v2 .create-upload{min-height:165px;padding:20px 12px;gap:7px}#voke-v2 .create-upload strong{font-size:14px}#voke-v2 .create-upload span{font-size:12px}#voke-v2 .create-upload small{font-size:10px}#voke-v2 .create-local{font-size:10px}
#voke-v2 .create-listing{display:block}#voke-v2 .create-cover-block{margin-bottom:22px}#voke-v2 .create-fields .v-input,#voke-v2 .create-source .v-input{font-size:16px}#voke-v2 .create-fields .v-field{font-size:12px;margin-bottom:15px}#voke-v2 .create-fields textarea.v-input{min-height:110px}#voke-v2 .create-price-grid{grid-template-columns:1.1fr 1fr;gap:8px}#voke-v2 .create-cover-upload{font-size:12px}#voke-v2 #create-cover .v-cover-title{font-size:28px}#voke-v2 .create-review-heading{align-items:flex-start}#voke-v2 .create-review-heading h1{font-size:22px}#voke-v2 .create-review-heading .create-edit{font-size:11px;padding-top:4px}
#voke-v2 .create-test-row{display:block}#voke-v2 .create-test-row .v-secondary{width:100%;margin-top:12px;font-size:13px}#voke-v2 .create-test-row p{font-size:12px}#voke-v2 .create-approve{font-size:12px}#voke-v2 .create-approval{margin-top:20px;padding-top:17px}#voke-v2 .create-continue{flex:1;min-width:0;min-height:48px}#voke-v2 .create-progress{display:none}#voke-v2 .create-bottom-actions{gap:15px}#voke-v2 .create-back{font-size:12px}#voke-v2 .create-product-review .v-product-media{max-width:none;width:100%}#voke-v2 .create-product-review .v-summary{padding:0;border:0;background:none}#voke-v2 .create-product-review .v-summary h1{font-size:25px}#voke-v2 .create-product-review .v-specs{font-size:12px}
}

<script>
(()=>{
'use strict';
/* Voke V4 card. The V3 prototype's look, wired to the live Voke server through the MCP Apps bridge:
   the first page comes from the model's `voke open` call; search, categories, paging and the saved and
   starred views call `voke` action "page"; stars call `voke_star`; the skill page calls `voke_skill`.
   Run copies the skill's run command ("/voke ad engine"), which the server loads when it's sent.
   No sign-in, payments or local publishing: Voke has no accounts in the card (identity is the personal
   connector link) and every library skill is free. Add Skill hands GitHub and YouTube links to chat,
   where the real intake -> test -> publish flow runs. */
const root=document.getElementById('voke-v2'),main=root.querySelector('#v-main'),search=root.querySelector('#v-search');
const preview=document.getElementById('voke-preview'),stage=document.getElementById('voke-stage'),statik=document.getElementById('vk-static');
const VERSION='4.0.0',PAGE=24;

/* ------------------------------------------------------------------ MCP Apps bridge (JSON-RPC over postMessage) */
let nextId=1,ready=false;const pending={};
const post=msg=>window.parent.postMessage(Object.assign({jsonrpc:'2.0'},msg),'*');
function request(method,params){return new Promise((resolve,reject)=>{const id=nextId++;pending[id]={resolve,reject};post({id,method,params:params||{}});setTimeout(()=>{if(pending[id]){delete pending[id];reject(new Error('timeout'));}},20000);});}
const notify=(method,params)=>post({method,params:params||{}});
const structured=r=>r&&(r.structuredContent||r.structured_content);
function callTool(name,args){return request('tools/call',{name,arguments:args}).then(r=>{const d=structured(r);if(!d||r.isError||r.is_error)throw new Error('tool failed');return d;});}
function sendChat(text){return request('ui/message',{role:'user',content:[{type:'text',text}]}).catch(()=>request('ui/message',{role:'user',content:{type:'text',text}}));}
function tellModel(text){request('ui/update-model-context',{content:[{type:'text',text}]}).catch(()=>{});}
window.addEventListener('message',e=>{
  if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0')return;
  if(m.id!=null&&pending[m.id]&&!m.method){const p=pending[m.id];delete pending[m.id];m.error?p.reject(m.error):p.resolve(m.result);return;}
  if(m.id!=null&&m.method){post({id:m.id,result:{}});return;}
  if(m.method==='ui/notifications/tool-input')onInput(m.params&&m.params.arguments);
  if(m.method==='ui/notifications/tool-result')onResult(m.params);
  if(m.method==='ui/notifications/host-context-changed')applyContext(m.params);
});

/* ------------------------------------------------------------------ per-viewer conveniences (never credentials) */
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch{return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}};
// Stars are shared; each browser gets an anonymous id so its star can be taken back (same id as the V3 card).
const voter=(()=>{const make=()=>{try{const b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>('0'+x.toString(16)).slice(-2)).join('');}catch{return (Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).slice(0,32);}};try{let v=localStorage.getItem('voke-voter');if(!/^[A-Za-z0-9_-]{8,64}$/.test(v||'')){v=make();localStorage.setItem('voke-voter',v);}return v;}catch{return make();}})();
let saved=store.get('voke-saved',[]);if(!Array.isArray(saved))saved=[];
const userTheme=store.get('voke-v4-theme',null);

/* ------------------------------------------------------------------ state */
const SIGIL={creator:'@',category:'#',resource:'*'};
let state={view:'market',query:'',catKey:'',filters:{},mode:'browse',shortQuery:'',results:[],total:0,next:null,loading:true,error:false,page:0,selected:null,creator:null,tab:0,theme:userTheme||'dark',categories:[],favs:[]};
let gen=0,trail=[],detailCache={},creatorList={loading:false,items:[],error:false},library=null,libraryLoading=null,menuOpen=false;
const byName=new Map();
const mobile=()=>stage.getBoundingClientRect().width<688; // same breakpoint as the design's container queries
const perPage=()=>6;
const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=Number(n)||1;return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);};
const catLabel=k=>{const c=state.categories.find(c=>c.key===k);return c?c.label:k?k.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase()):'';};
const runCommand=p=>'/voke '+String(p.name).toLowerCase();
function icons(){if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});}

/* Server card -> the prototype's product shape. Covers are generated from the skill's own title and category. */
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);}
function headline(title){const w=String(title).toUpperCase().split(/\s+/).filter(Boolean);if(!w.length)return '';if(w.length===1)return esc(w[0])+'.';const cut=Math.ceil(w.length/2);return esc(w.slice(0,cut).join(' '))+'<br>'+esc(w.slice(cut).join(' '))+'.';}
function product(c){
  const old=byName.get(c.name);const label=catLabel(c.category);
  const p={id:c.name,name:c.title||c.name,desc:c.description||'',shortDesc:c.blurb||'',catKey:c.category||'',category:label||'Skill',
    creator:(c.creator&&c.creator.handle)||'voke',creatorName:(c.creator&&c.creator.name)||'',stars:Number(c.stars)||(old&&old.stars)||1,
    starred:c.starred!=null?!!c.starred:!!(old&&old.starred),visibility:c.private?'private':'public',license:c.license||'',mit:!!c.mit,
    runs:c.runs||'',needs:c.needs||[],start:c.start||'',source:c.source||'',art:hash(c.category||c.name)%6,
    kicker:String((c.creator&&c.creator.name)||label||'Voke').toUpperCase(),headline:headline(c.title||c.name),label:`${label||'Skill'} / Skill`};
  byName.set(p.id,p);return p;
}
const find=id=>byName.get(id);

/* ------------------------------------------------------------------ host context */
function applyContext(ctx){
  if(!ctx)return;
  if(ctx.theme&&!store.get('voke-v4-theme',null)&&ctx.theme!==state.theme){state.theme=ctx.theme==='light'?'light':'dark';render();}
  const max=ctx.containerDimensions&&ctx.containerDimensions.maxHeight;if(max)document.documentElement.style.setProperty('--vk-max',Math.max(360,max-12)+'px');
  const fonts=ctx.styles&&ctx.styles.css&&ctx.styles.css.fonts;
  if(fonts&&!document.getElementById('vk-fonts')){const st=document.createElement('style');st.id='vk-fonts';st.textContent=fonts;document.head.appendChild(st);}
}

/* ------------------------------------------------------------------ tool results */
function onInput(args){if(args&&typeof args.query==='string'&&!search.value)search.value=args.query;}
function onResult(r){
  const d=structured(r);
  if(!d){state.loading=false;state.error=true;render();return;}
  if(d.view&&typeof d.view==='object'){showStatic(d.view);return;}
  absorb(d,false,true);render();refreshStars();loadFavs();
}
function absorb(d,append,first){
  state.loading=false;state.error=false;
  if(first&&d.mode==='shortlist'){state.mode='shortlist';state.shortQuery=d.query||'';}
  if(d.categories)state.categories=d.categories;
  state.filters={};(d.filters||[]).forEach(f=>{state.filters[f.kind]=f;});
  const cat=state.filters.category;state.catKey=cat&&cat.status==='ok'&&cat.value?cat.value.key:'';
  const items=(d.results||[]).map(product);
  state.results=append?state.results.concat(items):items;
  state.total=d.total||0;state.next=d.next_offset==null?null:d.next_offset;
  if(!append){state.page=0;state.query=d.query||'';if(document.activeElement!==search&&search.value!==state.query)search.value=state.query;}
}
function filterArgs(){const a={creator:'',category:state.catKey,resource:''};for(const k of ['creator','resource']){const f=state.filters[k];if(f)a[k]=f.value?f.value.key:f.query;}return a;}
function fetchPage(append,limit){
  const my=++gen;
  if(!append){state.loading=true;state.error=false;state.results=[];if(state.view==='market')render();}
  const args=Object.assign(filterArgs(),{action:'page',query:search.value.trim(),offset:append?state.next||0:0,limit:limit||PAGE,voter});
  args.mode=state.mode==='shortlist'&&args.query===state.shortQuery?'shortlist':'browse';
  return callTool('voke',args).then(d=>{if(my!==gen)return;absorb(d,append);render();})
    .catch(()=>{if(my!==gen)return;state.loading=false;if(!append)state.error=true;else state.pageError=true;render();});
}
function setCategory(key){state.catKey=key;delete state.filters.category;state.view='market';fetchPage(false);}
function clearFilter(kind){delete state.filters[kind];fetchPage(false);}

/* Stars: shared counts on the server, one per voter. */
function mergeStars(map){if(!map)return;Object.keys(map).forEach(n=>{const p=byName.get(n);if(p){p.stars=map[n].count;p.starred=!!map[n].starred;}const i=state.favs.indexOf(n);if(map[n].starred&&i<0)state.favs.push(n);else if(!map[n].starred&&i>-1)state.favs.splice(i,1);});}
function loadFavs(){callTool('voke_star',{voter}).then(d=>{mergeStars(d.stars);paintStars();}).catch(()=>{});}
function refreshStars(){const names=state.results.map(p=>p.id);if(!names.length)return;callTool('voke_star',{voter,names}).then(d=>{mergeStars(d.stars);paintStars();}).catch(()=>{});}
function paintStars(){
  root.querySelectorAll('[data-star-id]').forEach(b=>{const p=find(b.dataset.starId);if(!p)return;b.setAttribute('aria-pressed',String(!!p.starred));b.setAttribute('aria-label',`${p.starred?'Remove your star from':'Star'} ${p.name}, ${p.stars} ${p.stars===1?'star':'stars'}`);const n=b.querySelector('.v4-count');if(n)n.textContent=fmt(p.stars);});
  root.querySelectorAll('[data-star-count]').forEach(el=>{const p=find(el.dataset.starCount);if(p)el.textContent=fmt(p.stars);});
  const m=root.querySelector('[data-menu-count="starred"]');if(m)m.textContent=state.favs.length;
}
function toggleStar(id){
  const p=find(id);if(!p||p.busy)return;const was={stars:p.stars,starred:p.starred};
  p.starred=!was.starred;p.stars=Math.max(1,was.stars+(p.starred?1:-1));p.busy=true;paintStars();
  callTool('voke_star',{voter,name:id,on:p.starred}).then(d=>mergeStars(d.stars))
    .catch(()=>{p.stars=was.stars;p.starred=was.starred;flash('Couldn’t update that star. Try again.');})
    .finally(()=>{p.busy=false;paintStars();if(state.view==='starred')render();});
}

/* The whole library, for the Saved and Starred views (filtered here, like the V3 card). */
function loadLibrary(){
  if(library)return Promise.resolve(library);if(libraryLoading)return libraryLoading;
  const all=[];const step=off=>callTool('voke',{action:'page',query:'',offset:off,limit:50,voter}).then(d=>{if(d.categories&&!state.categories.length)state.categories=d.categories;(d.results||[]).forEach(c=>all.push(product(c)));return d.next_offset!=null&&all.length<500?step(d.next_offset):all;});
  libraryLoading=step(0).then(a=>{library=a;libraryLoading=null;return a;},e=>{libraryLoading=null;throw e;});return libraryLoading;
}

/* ------------------------------------------------------------------ navigation */
function go(view,extra={}){trail.push({view:state.view,selected:state.selected,creator:state.creator});menuOpen=false;state={...state,view,...extra,tab:0};if(view!=='market')state.listPage=state.page;render();root.scrollTop=0;}
function back(){const t=trail.pop();menuOpen=false;if(!t||t.view===state.view&&t.selected===state.selected){state.view='market';}else Object.assign(state,t);if(state.view==='market'&&state.listPage!=null){state.page=state.listPage;}render();root.scrollTop=0;}
function home(){trail=[];state.view='market';if(state.query||state.catKey||Object.keys(state.filters).length||state.mode==='shortlist'){search.value='';state.query='';state.catKey='';state.filters={};state.mode='browse';fetchPage(false);}else render();root.scrollTop=0;}

/* ------------------------------------------------------------------ markup (prototype components) */
const backButton=()=>`<div class="v-detail-top"><button class="v-back cursor-interaction" data-action="back" aria-label="Back">${icon('chevron-left')}</button><span class="v-version">VOKE / V4</span></div>`;
const footer=()=>`<footer class="v-footer"><span>voke. &nbsp; Built by people. Powered by possibility.</span><span>Voke V4</span></footer>`;
function cover(p,linked=true){const tag=linked?'a':'div';return `<div class="v-cover"><${tag} ${linked?`href="#skill-${esc(p.id)}" data-action="detail" data-id="${esc(p.id)}" aria-label="View ${esc(p.name)}"`:''} class="v-art-link v-art-${p.art} ${linked?'cursor-interaction':''}">${p.media?(p.media.kind==='video'?`<video class="v-uploaded-media" src="${p.media.url}" muted playsinline preload="metadata" aria-label="${esc(p.name)} cover video"></video>`:`<img class="v-uploaded-media" src="${p.media.url}" alt="${esc(p.name)} cover">`):`<span class="v-sculpture" aria-hidden="true"><i></i><i></i><i></i></span><span class="v-cover-kicker">${esc(p.kicker)}</span><span class="v-cover-title">${p.headline}</span><span class="v-cover-label">${esc(p.label)}</span>`}</${tag}>${p.id==='draft'?'':`<button class="v-save cursor-interaction" data-action="bookmark" data-id="${esc(p.id)}" aria-pressed="${saved.includes(p.id)}" aria-label="${saved.includes(p.id)?'Unsave':'Save'} ${esc(p.name)}">${icon('bookmark')}</button>`}</div>`;}
function meta(p,interactive=false){return `<div class="v-meta">${interactive?`<button type="button" class="v-star-toggle" data-star-id="${esc(p.id)}" aria-pressed="${!!p.starred}" aria-label="${p.starred?'Remove your star from':'Star'} ${esc(p.name)}">${icon('star')}</button>`:icon('star')}<span data-star-count="${esc(p.id)}">${fmt(p.stars)}</span><span class="v-tiny">stars</span>${p.id==='draft'?`<span>@${esc(p.creator)}</span>`:`<a class="cursor-interaction" href="#creator-${esc(p.creator)}" data-action="creator" data-creator="${esc(p.creator)}">@${esc(p.creator)}</a>`}</div>`;}
const access=p=>p.visibility==='private'?'Private':'Free';
function card(p){const star=`<button type="button" class="v-card-stars" data-star-id="${esc(p.id)}" aria-pressed="${!!p.starred}" aria-label="${p.starred?'Remove your star from':'Star'} ${esc(p.name)}, ${p.stars} stars">${icon('star')}<span class="v4-count">${fmt(p.stars)}</span></button>`;const run=`<button class="v-run cursor-interaction" data-action="start" data-id="${esc(p.id)}" aria-label="Run ${esc(p.name)}">Run ${icon('arrow-up-right')}</button>`;return `<article class="v-product">${cover(p)}<div class="v-card-info"><h2 data-tooltip="${esc(p.name)}"><a class="cursor-interaction" href="#skill-${esc(p.id)}" data-action="detail" data-id="${esc(p.id)}">${esc(p.name)}</a></h2><p class="v-description">${esc(p.desc)}</p><p class="v-mobile-summary">${esc(p.shortDesc||p.desc)}</p>${meta(p)}<div class="v-price-run">${star}<span class="v-price">${access(p)}</span>${run}</div><div class="v-mobile-footer"><a href="#creator-${esc(p.creator)}" class="cursor-interaction" data-action="creator" data-creator="${esc(p.creator)}">@${esc(p.creator)}</a><span>${access(p)}</span>${run}</div></div></article>`;}
function pager(count,total){const per=perPage();return `<nav class="v-pager" aria-label="Skill pages"><button class="v-button cursor-interaction" data-action="prev" aria-label="Previous skills">${icon('arrow-left')}</button><span id="v-page-label" aria-live="polite">${state.page*per+1}–${Math.min((state.page+1)*per,total)} of ${total}</span><div class="v-dots" data-count="${count}">${dots(count)}</div><button class="v-button cursor-interaction" data-action="next" aria-label="Next skills">${icon('arrow-right')}</button></nav>`;}
/* At most seven dots, a window around the current page, so long results never widen the card. */
const DOTS=7;
function dots(count){const start=Math.max(0,Math.min(state.page-3,count-DOTS));return Array.from({length:Math.min(count,DOTS)},(_,k)=>{const i=start+k;return `<button class="v-dot cursor-interaction" data-action="page" data-page="${i}" aria-label="Page ${i+1} of ${count}" aria-pressed="${i===state.page}"></button>`;}).join('');}
function empty(title,body,actions=''){return `<div class="v-empty"><h2>${title}</h2><p>${body}</p>${actions}</div>`;}
const loadingState=(text='Loading skills…')=>`<div class="v-empty v4-loading" role="status">${icon('loader-circle')}<p>${text}</p></div>`;
const errorState=(action='retry',text='Couldn’t load skills.')=>`<div class="v-empty" role="alert"><h2>${text}</h2><p>Check your connection and try again.</p><button class="v-button cursor-interaction" data-action="${action}">${icon('rotate-cw')}Try again</button></div>`;
/* Paged grid. `total` can exceed what's loaded: the pager counts every result and loads more on demand. */
function grid(list,total,emptyHtml){
  if(!list.length)return emptyHtml;
  const per=perPage(),chunks=[];for(let i=0;i<list.length;i+=per)chunks.push(list.slice(i,i+per));
  const count=Math.max(chunks.length,Math.ceil((total||list.length)/per));state.page=Math.min(state.page,count-1);
  return `<div class="v-grid"><div class="v-pages" id="v-pages" aria-label="${per} skills per page">${chunks.map((c,i)=>`<section class="v-page" aria-label="Skill page ${i+1}">${c.map(card).join('')}</section>`).join('')}</div></div>${pager(count,total||list.length)}`;
}
function filterNotice(){
  const bad=Object.values(state.filters).find(f=>f.status!=='ok');
  if(bad&&bad.status==='ambiguous')return `<div class="v4-notice" role="status"><span><b>${esc(SIGIL[bad.kind]+bad.query)}</b> matches several ${bad.kind}s:</span>${(bad.candidates||[]).map(c=>`<button class="v-chip cursor-interaction" data-action="pick-filter" data-kind="${bad.kind}" data-key="${esc(c.key)}" data-label="${esc(c.label||c.key)}">${esc(SIGIL[bad.kind]+c.key)}</button>`).join('')}</div>`;
  if(bad)return `<div class="v4-notice" role="status"><span>No Voke ${bad.kind} matches <b>${esc(SIGIL[bad.kind]+bad.query)}</b>.</span><button class="v-chip cursor-interaction" data-action="clear-filter" data-kind="${bad.kind}">Browse without it</button></div>`;
  const on=['creator','resource'].map(k=>state.filters[k]).filter(f=>f&&f.status==='ok');
  return on.length?`<div class="v4-notice">${on.map(f=>`<button class="v-chip cursor-interaction" data-action="clear-filter" data-kind="${f.kind}" aria-label="Remove filter ${esc(SIGIL[f.kind]+(f.value?f.value.key:f.query))}">${esc(SIGIL[f.kind]+(f.value?f.value.label||f.value.key:f.query))} ${icon('x')}</button>`).join('')}</div>`:'';
}
function market(){
  const cats=[{key:'',label:'All'}].concat(state.categories);
  const short=state.mode==='shortlist'&&state.query===state.shortQuery;
  const scoped=state.query||state.catKey||Object.keys(state.filters).length;
  let body;
  if(state.loading)body=loadingState();
  else if(state.error)body=errorState();
  else if(Object.values(state.filters).some(f=>f.status!=='ok'))body='';
  else body=grid(state.results,state.total,empty(scoped?'No skills found':'No skills yet',scoped?'Try a different search, or browse every skill.':'The library is empty right now.',scoped?`<button class="v-button cursor-interaction" data-action="home">Browse all skills</button>`:''));
  return `<h1 class="sr-only">Voke skills</h1><div class="v-toolbar"><nav class="v-categories" aria-label="Skill categories">${cats.map(c=>`<button class="v-chip cursor-interaction" data-action="category" data-category="${esc(c.key)}" aria-pressed="${state.catKey===c.key}">${esc(c.label)}</button>`).join('')}</nav></div>${short?`<p class="v4-shortlist">Best matches for <b>“${esc(state.query)}”</b>. Pick one to run it.</p>`:''}${filterNotice()}${!state.loading&&!state.error&&scoped&&state.results.length?`<div class="v-results" aria-live="polite"><strong>${state.query?`“${esc(state.query)}”`:state.catKey?esc(catLabel(state.catKey)):'Filtered'}</strong><span>${state.total} ${state.total===1?'skill':'skills'}</span></div>`:''}${body}${footer()}`;
}
function specs(p){const d=detailCache[p.id]&&detailCache[p.id].detail;const rows=[['Category',esc(p.category)],['Access',p.visibility==='private'?'Private · only you':'Free'],['Stars',`<span data-star-count="${esc(p.id)}">${fmt(p.stars)}</span>`],['Creator',p.id==='draft'?`@${esc(p.creator)}`:`<a href="#creator-${esc(p.creator)}" data-action="creator" data-creator="${esc(p.creator)}">@${esc(p.creator)}</a>`]];if(p.license)rows.push(['License',esc(p.license==='proprietary'?'Voke':p.license)]);const runs=(d&&d.runs)||p.runs;if(runs)rows.push(['Runs',esc(runs)]);const con=(d&&d.connections)||p.needs;if(con&&con.length)rows.push(['Connections',esc(con.join(', '))]);if(d&&d.cost)rows.push(['Cost',esc(d.cost)]);return `<dl class="v-specs">${rows.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')}</dl>`;}
function runBlock(p){return `<div class="v-purchase"><button class="v-primary cursor-interaction" data-action="start" data-id="${esc(p.id)}">Run Skill ${icon('arrow-up-right')}</button><span class="v-trial-note">${p.visibility==='private'?'Only you can see this skill':'Free to use'} · Copies <code>${esc(runCommand(p))}</code> for your chat</span></div>`;}
function stepTitle(s){return typeof s==='string'?s:(s&&(s.title||s.name))||'';}
function detailTabs(p){
  const entry=detailCache[p.id],d=entry&&entry.detail,wait=entry&&entry.loading,failed=entry&&entry.error;
  const outs=(d&&d.outputs)||[],steps=((d&&d.steps)||[]).map(stepTitle).filter(Boolean);
  const pending=wait?`<p class="v-tiny" role="status">Loading details…</p>`:failed?`<p class="v-tiny" role="alert">Couldn’t load more details. <button class="v-link" data-action="retry-detail" data-id="${esc(p.id)}">Try again</button></p>`:'';
  const panels=[
    `<h2>What this skill does</h2><p>${esc(p.desc)}</p>${outs.length?`<h2>What you get</h2><ul>${outs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${pending}`,
    `<h2>Start with your context</h2><p>${esc(p.start||'Run the skill, then answer its questions one at a time.')}</p>${steps.length?`<h2>Steps</h2><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}${pending}`,
    `<h2>Skill details</h2>${specs(p)}`,
    `<div class="v-inline-creator"><span class="v-avatar">${esc(p.creator.slice(0,2).toUpperCase())}</span><a href="#creator-${esc(p.creator)}" data-action="creator" data-creator="${esc(p.creator)}">@${esc(p.creator)}</a></div><p>${esc(p.creatorName||'')}${p.creatorName?' · ':''}Explore more skills from this creator.</p><button class="v-button cursor-interaction" style="margin-top:12px" data-action="creator" data-creator="${esc(p.creator)}">View skills</button>`];
  return `<section class="v-detail-tabs"><nav class="v-tab-nav" role="tablist" aria-label="Skill information">${['Overview','How to use','Details','Creator'].map((t,i)=>`<button class="v-tab cursor-interaction" role="tab" id="v-tab-${i}" aria-controls="v-panel-${i}" aria-selected="${state.tab===i}" tabindex="${state.tab===i?0:-1}" data-action="tab" data-tab="${i}">${t}</button>`).join('')}</nav><div class="v-tab-rail" id="v-tab-rail">${panels.map((x,i)=>`<section class="v-tab-pane" role="tabpanel" id="v-panel-${i}" aria-labelledby="v-tab-${i}">${x}</section>`).join('')}</div></section>`;
}
function productDetail(p,review=false){return `<div class="v-product-layout ${review?'create-product-review':''}"><div class="v-product-media">${cover(p,false)}</div><aside class="v-summary"><span class="v-badge">${esc(p.category)} / ${p.visibility==='private'?'Private skill':'Skill'}</span><h1>${esc(p.name)}</h1>${meta(p,!review)}<p class="v-summary-description">${esc(p.desc)}</p>${review?`<div class="create-review-price"><span>${access(p)}</span><small>${p.visibility==='private'?'Only you can see and run it':'Anyone can find and run it'}</small></div>`:runBlock(p)}${specs(p)}</aside>${review?'':detailTabs(p)}</div>`;}

  b.innerHTML=`<div class="v-handoff-symbol">${icon(status==='copied'||status==='sent'?'check':'clipboard')}</div><div class="v-handoff-body"><div role="status" aria-live="polite"><strong>${head}</strong><p>${body}</p></div>${status==='manual'?`<textarea readonly class="v-handoff-text" aria-label="Text to paste in chat">${esc(text)}</textarea><button type="button" class="v-handoff-retry cursor-interaction" data-action="copy-again">Copy text</button>`:''}</div><button type="button" class="v-handoff-close cursor-interaction" data-action="dismiss-handoff" aria-label="Dismiss notification">${icon('x')}</button>`;

}
async function copyText(text){
  const t=document.createElement('textarea');t.className='v-copy-buffer';t.value=text;t.readOnly=true;root.append(t);
  const prev=document.activeElement;t.select();t.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}catch{}t.remove();prev?.focus?.({preventScroll:true});
  if(!ok&&navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(text);ok=true;}catch{}}
  return ok;
}
async function runSkill(p){
  if(!p)return;const ticket=++handoffSeq,text=runCommand(p);
  tellModel(`The user picked the Voke skill "${p.name}" (name: ${p.id}) in the Voke card to run next.`);
  const ok=await copyText(text);if(ticket!==handoffSeq)return;
  handoffBanner(p.name,text,ok?'copied':'manual',ok?`Paste <strong>${esc(p.name)}</strong> into your chat bar below to run skill.`:'Automatic copy is unavailable here. Copy the text below, then paste it into your chat and send it.');
}
/* For chat handoffs (Add Skill): send the message when the host allows it, else copy it. */
async function handToChat(text,label){
  try{await sendChat(text);handoffBanner(label,text,'sent','Voke is picking it up in the chat below.');return 'sent';}
  catch{const ok=await copyText(text);handoffBanner(label,text,ok?'copied':'manual',ok?`Paste it into your chat bar below and send it to continue.`:'Copy the text below, then paste it into your chat and send it.');return ok?'copied':'manual';}
}

/* ------------------------------------------------------------------ rails (paging, tabs) */
function railTo(rail,index,smooth){if(!rail||!rail.children[index])return;const left=rail.children[index].offsetLeft-rail.children[0].offsetLeft;rail.scrollTo({left,behavior:smooth&&!matchMedia('(prefers-reduced-motion: reduce)').matches?'smooth':'instant'});}
function syncPager(){const pages=root.querySelector('#v-pages');if(!pages)return;const box=root.querySelector('.v-dots'),count=Number(box&&box.dataset.count)||0;if(box){box.innerHTML=dots(count);}const label=root.querySelector('#v-page-label');const total=Number((label&&label.textContent.split(' of ')[1])||0);if(label)label.textContent=`${state.page*perPage()+1}–${Math.min((state.page+1)*perPage(),total)} of ${total}`;const prev=root.querySelector('[data-action="prev"]'),next=root.querySelector('[data-action="next"]');if(prev)prev.disabled=state.page===0;if(next)next.disabled=state.page>=count-1;}
function setPage(index){
  const rail=root.querySelector('#v-pages');if(!rail)return;const count=Number(root.querySelector('.v-dots')?.dataset.count)||1;index=Math.max(0,Math.min(index,count-1));

  state.page=index;railTo(rail,index,true);syncPager();

function bindRail(id,key,update){const rail=root.querySelector(id);if(!rail)return;let timer;rail.addEventListener('scroll',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(rail.scrollWidth<=rail.clientWidth+2)return;const gap=parseFloat(getComputedStyle(rail).gap)||0;const n=Math.max(0,Math.min(rail.children.length-1,Math.round(rail.scrollLeft/(rail.clientWidth+gap))));if(n!==state[key]){state[key]=n;update();}},100);},{passive:true});}

function creatorReset(){if(draftMedia?.url)URL.revokeObjectURL(draftMedia.url);draft={name:'',desc:'',catKey:'',visibility:'public',source:'',files:[],coverName:'',edited:{},approved:false,skillContent:'',sourceOpen:false,useDefaultCover:false};draftMedia=null;editorStep=0;createMessage='';createCopyState='';createManual='';createSent='';}

  const panes=[
`<div class="create-heading"><h1>Add Skill</h1><p>Upload your skill or link it. We’ll help with the listing.</p></div><label class="create-upload ${createBusy?'is-busy':''}" id="create-drop">${icon(createBusy?'loader-circle':'upload')}<strong>${createBusy?'Reading your skill…':'Upload skill files'}</strong><span>Choose files or drag them here</span><small>MD, TXT, JSON, YAML or ZIP · up to 6 files</small><input type="file" id="create-files" aria-label="Upload skill files" multiple accept=".md,.markdown,.txt,.json,.yaml,.yml,.zip" ${createBusy?'disabled':''}></label><ul class="create-files">${creatorFiles()}</ul><div class="create-or"><span>or</span></div><button type="button" class="create-link-toggle" data-create="source" aria-expanded="${!!draft.sourceOpen}"><span>Create from a GitHub or YouTube link</span>${icon(draft.sourceOpen?'minus':'plus')}</button>${draft.sourceOpen?`<label class="v-field create-source">Source URL<input class="v-input" data-create-field="source" type="url" value="${esc(draft.source)}" placeholder="https://github.com/owner/repo"><small>GitHub skills go through Voke’s read, test and publish flow. YouTube videos become a skill with Video to Skill.</small></label>`:''}<p class="create-local">Review and edit your listing before you publish.</p>`,
`<div class="create-listing">${creatorCoverInput()}<div class="create-fields"><label class="v-field">Skill name<input class="v-input" data-create-field="name" maxlength="60" value="${esc(draft.name)}" placeholder="Give your skill a clear name"></label><label class="v-field">Skill description<textarea class="v-input" data-create-field="desc" maxlength="1200" rows="2" placeholder="What will this skill help someone do?">${esc(draft.desc)}</textarea></label><label class="v-field">Category<select class="v-input" data-create-field="catKey">${catOptions()}</select></label><div class="create-price-grid"><label class="v-field">Access<select class="v-input" data-create-field="visibility"><option value="public" ${draft.visibility==='public'?'selected':''}>Public · free</option><option value="private" ${draft.visibility==='private'?'selected':''}>Private · only you</option></select></label><p class="v4-access-help">${draft.visibility==='private'?'Private needs your personal Voke link.':'Public needs one test run first.'}</p></div></div></div>`,
`${productDetail(draftProduct(),true)}<section class="create-approval"><div class="create-test-row"><div><strong>Take it for a test drive</strong><p>${isGithub(link)?'Voke runs it once in chat so you can see it work.':draft.skillContent?'Copy the skill, try it in chat, then come back to approve.':'Voke tries the link in chat first.'}</p></div><button type="button" class="v-secondary" data-create="test">${icon(createCopyState==='copied'?'check':'copy')}${createCopyState?'Test again':'Test skill'}</button></div><p class="create-copy-status" role="status">${createCopyState==='copied'?'Copied. Paste it into your chat to test.':createCopyState==='sent'?'Sent to chat. Your test runs there.':createCopyState==='manual'?'Select and copy the text below, then paste it into chat.':''}</p>${createManual?`<textarea class="v-input create-manual" readonly aria-label="Text to copy">${esc(createManual)}</textarea>`:''}${canPublish?'':`<p class="v4-publish-note">Publishing from uploaded files isn’t connected yet. Add the skill’s GitHub link in step 1 to publish it.</p>`}<label class="create-approve"><input type="checkbox" id="create-approve" ${draft.approved?'checked':''} ${canPublish?'':'disabled'}><span>I’ve reviewed this listing and approve it for ${draft.visibility==='private'?'saving':'publication'}.</span></label>${createSent?`<p class="create-copy-status" role="status">${esc(createSent)}</p>`:''}</section>`];
  return `<section class="create-flow" aria-label="Add a skill"><form id="v-skill-form" novalidate><div class="create-rail" id="v-create-rail">${panes.map((body,i)=>`<section class="create-pane ${editorStep===i?'is-current':''}" id="create-pane-${i}" aria-label="${steps[i]}" ${editorStep===i?'':'inert'}>${body}</section>`).join('')}</div><div class="create-bottom"><p id="create-status" role="alert">${esc(createMessage)}</p><div class="create-bottom-actions"><button type="button" class="v-primary create-continue" data-create="${editorStep<2?'continue':'publish'}" ${createBusy||editorStep===2&&(!draft.approved||!canPublish)?'disabled':''}>${editorStep<2?'Continue':publishLabel()}${icon(editorStep<2?'arrow-right':'arrow-up-right')}</button></div></div></form></section>`;
}
function creatorBind(){if(state.view!=='add')return;const rail=root.querySelector('#v-create-rail');if(!rail)return;createScrollingUntil=Date.now()+400;rail.scrollLeft=editorStep*rail.clientWidth;let t;rail.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>{if(Date.now()<createScrollingUntil)return;const n=Math.round(rail.scrollLeft/rail.clientWidth);if(n!==editorStep)createStep(n,true);},120);});}
function textMeta(text,key){const front=text.match(/^﻿?---\s*\r?\n([\s\S]*?)\r?\n---/);if(!front)return '';const lines=front[1].split(/\r?\n/);const idx=lines.findIndex(l=>new RegExp('^'+key+':','i').test(l));if(idx<0)return '';let v=lines[idx].replace(/^[^:]+:\s*/,'').trim();if(/^[>|][-+]?\s*$/.test(v))v=lines.slice(idx+1).filter((l,i,a)=>/^\s/.test(l)&&a.slice(0,i).every(x=>/^\s/.test(x))).map(x=>x.trim()).join(' ');return v.replace(/^['"]|['"]$/g,'');}
function listingSuggestions(text,filename){let obj={};try{obj=JSON.parse(text);if(!obj||typeof obj!=='object')obj={};}catch{}const clean=text.replace(/^﻿?---\s*\r?\n[\s\S]*?\r?\n---\s*/,'');let name=String(obj.name||obj.title||textMeta(text,'name')||textMeta(text,'title')||clean.match(/^#\s+(.+)$/m)?.[1]||filename.replace(/\.(md|markdown|txt|json|ya?ml)$/i,'').replace(/[_-]/g,' ')).trim();if(/^[a-z0-9 -]+$/.test(name))name=name.replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());const desc=String(obj.description||obj.summary||textMeta(text,'description')||textMeta(text,'summary')||clean.split(/\n\s*\n/).find(p=>p.trim()&&!/^[#`\-*>\[]/.test(p.trim()))||'').replace(/\s+/g,' ').trim();const want=String(obj.category||textMeta(text,'category')||'').toLowerCase();const hit=state.categories.find(c=>c.key===want||c.label.toLowerCase()===want);return {name:name.slice(0,60),desc:desc.slice(0,1200),catKey:hit?hit.key:''};}
async function creatorReadFiles(files){
  if(createBusy)return;createBusy=true;createMessage='';render();const seq=++createSequence;const errors=[];
  for(const f of [...files]){
    if(draft.files.length>=6){errors.push('Use up to 6 files.');break;}
    if(draft.files.some(x=>x.name===f.name&&x.size===f.size))continue;
    try{
      if(f.size>20*1024*1024)throw Error('Files must be 20 MB or smaller.');let parts=[];
      if(/\.zip$/i.test(f.name)){const zip=await JSZip.loadAsync(f);const entries=Object.values(zip.files).filter(e=>!e.dir&&!/(^|\/)__MACOSX\//.test(e.name)&&/\.(md|markdown|txt|json|ya?ml)$/i.test(e.name));if(!entries.length)throw Error('The ZIP needs a readable SKILL.md, Markdown, TXT, JSON or YAML file.');if(entries.length>30)throw Error('Use a package with up to 30 text files.');let total=0;for(const e of entries){if(e._data?.uncompressedSize>500000)throw Error('Each text file must be under 500 KB.');const text=await e.async('string');total+=text.length;if(total>500000)throw Error('Use a package with under 500 KB of text.');parts.push({name:e.name,text});}parts.sort((a,b)=>Number(/(^|\/)skill\.md$/i.test(b.name))-Number(/(^|\/)skill\.md$/i.test(a.name)));}
      else{if(!/\.(md|markdown|txt|json|ya?ml)$/i.test(f.name))throw Error('Use MD, TXT, JSON, YAML or ZIP files.');if(f.size>500000)throw Error('Text files must be under 500 KB.');parts=[{name:f.name,text:await f.text()}];}
      if(!parts.some(p=>p.text.trim()))throw Error('This file is empty.');if(seq!==createSequence)return;
      const m=parts[0],base=m.name.split('/').pop();
      draft.files.push({name:f.name,size:f.size,entries:parts.length,text:parts.map(p=>parts.length===1?p.text:`# File: ${p.name}\n\n${p.text}`).join('\n\n'),suggestions:listingSuggestions(m.text,base==='SKILL.md'?m.name.split('/').slice(-2,-1)[0]||f.name:base)});
    }catch(e){errors.push(f.name+': '+e.message);}
  }
  draft.skillContent=draft.files.map(f=>f.text||'').filter(Boolean).join('\n\n');
  if(draft.files.length){const s=draft.files[0].suggestions;for(const k of ['name','desc','catKey'])if(!draft.edited[k]&&s&&s[k])draft[k]=s[k];draft.approved=false;}
  createBusy=false;createMessage=errors.join(' ');render();
}
function listingLine(){const parts=[`name "${draft.name.trim()}"`,draft.visibility==='private'?'Private':'Public'];if(draft.catKey)parts.push(`category ${draft.catKey}`);if(draft.desc.trim())parts.push(`description: ${draft.desc.trim().replace(/\s+/g,' ').slice(0,300)}`);return parts.join(', ');}
async function creatorTest(){
  const link=draft.source.trim();
  if(isGithub(link)){createCopyState=(await handToChat(`/voke test ${link}`,draft.name||'your skill'))==='manual'?'manual':'sent';createManual=createCopyState==='manual'?`/voke test ${link}`:'';render();return;}
  if(isYoutube(link)&&!draft.skillContent){const t=`Use the Voke Video to Skill skill on ${link} and run the result once as a test.`;createCopyState=(await handToChat(t,draft.name||'your skill'))==='manual'?'manual':'sent';createManual=createCopyState==='manual'?t:'';render();return;}
  const text=draft.skillContent.trim();if(!text){createError('Add skill content before testing.');return;}
  const ok=await copyText(text);createCopyState=ok?'copied':'manual';createManual=ok?'':text;render();
}
async function creatorPublish(){
  if(!creatorSourceOK()||!creatorListingOK()){createStep(2);return;}
  if(!draft.approved){createError('Review and approve your listing before publishing.');return;}
  const link=draft.source.trim();
  const text=isGithub(link)?`/voke publish ${link} — ${listingLine()}`:isYoutube(link)?`Use the Voke Video to Skill skill to turn ${link} into a skill and publish it: ${listingLine()}`:'';
  if(!text){createError('Add the skill’s GitHub link in step 1 to publish it.');return;}
  const how=await handToChat(text,draft.name);
  createSent=how==='sent'?'Sent to chat. Voke finishes publishing there and confirms when it’s live.':'Send the copied message in chat to finish publishing.';render();
}
root.addEventListener('click',e=>{
  const step=e.target.closest('[data-create-step]'),b=e.target.closest('[data-create]');
  if(step){e.preventDefault();createStep(Number(step.dataset.createStep),true);return;}
  if(!b)return;e.preventDefault();const a=b.dataset.create;
  if(a==='close'){creatorReset();back();return;}
  if(a==='continue')createStep(editorStep+1);
  if(a==='publish')creatorPublish();
  if(a==='test')creatorTest();
  if(a==='source'){draft.sourceOpen=!draft.sourceOpen;render();if(draft.sourceOpen)root.querySelector('[data-create-field="source"]')?.focus();}
  if(a==='remove'){draft.files.splice(Number(b.dataset.index),1);draft.skillContent=draft.files.map(f=>f.text||'').join('\n\n');draft.approved=false;render();}
  if(a==='default-cover'){if(draftMedia?.url)URL.revokeObjectURL(draftMedia.url);draftMedia=null;draft.coverName='';draft.useDefaultCover=true;draft.approved=false;render();}
});
root.addEventListener('input',e=>{const k=e.target.dataset.createField;if(!k)return;draft[k]=e.target.value;draft.edited[k]=true;draft.approved=false;createError('');});
root.addEventListener('change',e=>{
  const k=e.target.dataset.createField;if(k){draft[k]=e.target.value;draft.edited[k]=true;draft.approved=false;if(k==='visibility'||k==='catKey')render();}
  if(e.target.id==='create-approve'){draft.approved=e.target.checked;const btn=root.querySelector('[data-create="publish"]');if(btn)btn.disabled=!draft.approved;}
  if(e.target.id==='create-files')creatorReadFiles(e.target.files);
  if(e.target.id==='create-cover-file'){const f=e.target.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp','image/gif','video/mp4','video/webm'].includes(f.type)||f.size>50*1024*1024){createError('Choose an image, GIF, MP4 or WebM under 50 MB.');return;}if(draftMedia?.url)URL.revokeObjectURL(draftMedia.url);draftMedia={url:URL.createObjectURL(f),kind:f.type.startsWith('video/')?'video':'image'};draft.coverName=f.name;draft.approved=false;render();}
});
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='v-skill-form'){editorStep<2?createStep(editorStep+1):creatorPublish();}});
root.addEventListener('dragover',e=>{const d=e.target.closest('#create-drop');if(d){e.preventDefault();d.classList.add('dragging');}});
root.addEventListener('dragleave',e=>e.target.closest('#create-drop')?.classList.remove('dragging'));
root.addEventListener('drop',e=>{if(e.target.closest('#create-drop')){e.preventDefault();creatorReadFiles(e.dataTransfer.files);}});

/* ------------------------------------------------------------------ non-browser results (load, intake, test, publish) */
/* The card is attached to the one `voke` tool, so it also renders for load (a one-line "Running" strip),
   intake/test/publish (recipe and repo cards) and hides itself for search, file and transcript. */
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function btn(label,cls,fn){const b=h('button',cls,label);b.type='button';b.onclick=fn;return b;}
function say(text,b,done){b.disabled=true;const label=b.textContent;b.textContent='Sending…';sendChat(text).then(()=>{b.textContent=done||'Sent';}).catch(()=>{b.disabled=false;b.textContent=label;const n=h('p','vs-note');n.innerHTML='Couldn’t send from here. Type <code>'+esc(text)+'</code> in chat.';b.closest('.vs-acts,.vs-row').after(n);});}
const pill=(t,c)=>h('span','vs-pill'+(c?' '+c:''),t);
function recipe(v,box){
  const r=h('div','vs-rc');r.appendChild(h('div','vs-why','GitHub to Skill'));r.appendChild(h('h2',null,v.title));
  const m=h('div','vs-meta');m.appendChild(h('span',null,v.repo));m.appendChild(pill(v.verdict_label,v.verdict==='handoff'?'warn':'ok'));m.appendChild(pill('License: '+v.license,v.open_license?'':'warn'));m.appendChild(pill(v.mit?'MIT':'Not MIT',v.mit?'ok':''));r.appendChild(m);
  if(v.reasons&&v.reasons.length)r.appendChild(h('div','vs-why','Why: '+v.reasons.join('; ')));
  if(v.description)r.appendChild(h('p','vs-d',v.description));
  if(v.steps&&v.steps.length){r.appendChild(h('h3',null,'Steps'));const ol=h('ol','vs-steps');v.steps.forEach(st=>{const li=h('li'),t=h('div','vs-t',st.title),tl=h('div','vs-tools');(st.tools&&st.tools.length?st.tools:[v.verdict==='handoff'?'Claude Code or Codex':'Chat']).forEach(x=>tl.appendChild(pill(x)));t.appendChild(tl);li.appendChild(t);ol.appendChild(li);});r.appendChild(ol);}
  const needs=(v.services||[]).map(x=>x.name+(x.instant?' (Composio, may need no account)':' (via Composio)'));
  if(needs.length||(v.env_vars||[]).length){r.appendChild(h('h3',null,'Connections'));r.appendChild(h('div','vs-kv',needs.concat((v.env_vars||[]).map(e=>'key '+e)).join(' · ')));}
  r.appendChild(h('h3',null,'Cost to run'));const c=v.cost||{},ck=h('div','vs-kv');
  ck.innerHTML=c.lines&&c.lines.length?'Roughly <b>$'+c.low.toFixed(2)+'–$'+c.high.toFixed(2)+'</b> per run in outside services, plus Claude usage from your plan. '+esc(c.lines.map(x=>x.service+' '+x.range).join(' · '))+'. Ballpark only.':'Nothing beyond Claude usage from your plan.';
  (c.notes||[]).forEach(n=>ck.appendChild(h('div','vs-why',n+'.')));r.appendChild(ck);
  if(v.tags&&v.tags.length){r.appendChild(h('h3',null,'Found under'));const tg=h('div','vs-tags');v.tags.slice(0,12).forEach(x=>tg.appendChild(pill(x)));r.appendChild(tg);}
  const a=h('div','vs-acts');
  if(v.in_library)a.appendChild(pill('Published on Voke','ok'));
  else{a.appendChild(btn(v.verdict==='handoff'?'Get the prompt':'Test it','vs-btn primary',function(){say('/voke test '+v.url,this,'Testing');}));a.appendChild(btn('Publish','vs-btn',function(){say('/voke publish '+v.url,this,'Publishing');}));}
  r.appendChild(a);
  if(!v.in_library)r.appendChild(h('p','vs-note',(v.open_license?(v.tested?'Ready to publish Public or Private.':'Public needs one test run first; Private doesn’t.'):'No open license, so it can only be published Private.')+(v.signed_in?'':' Private needs your personal Voke link.')));
  box.appendChild(r);
}
function bundle(v,box){
  const top=h('div','vs-rc');top.appendChild(h('div','vs-why','GitHub to Skill'));top.appendChild(h('h2',null,v.repo));
  const m=h('div','vs-meta');m.appendChild(h('span',null,v.skills.length+' skills by @'+v.creator));const mit=v.skills.filter(s=>s.mit).length;m.appendChild(pill(mit===v.skills.length?'All MIT':mit+' of '+v.skills.length+' MIT',mit===v.skills.length?'ok':''));top.appendChild(m);
  top.appendChild(h('div','vs-why','Each one publishes as its own skill with its own /voke command, all under @'+v.creator+'.'));
  const l=h('div','vs-list');
  v.skills.forEach(c=>{const row=h('div','vs-row'),body=h('div','vs-body'),t=h('div','vs-top');t.appendChild(h('span','vs-name',c.title));t.appendChild(pill(c.verdict_label,c.verdict==='handoff'?'warn':'ok'));if(!c.open_license)t.appendChild(pill('License: '+c.license,'warn'));if(c.in_library)t.appendChild(pill('On Voke','ok'));body.appendChild(t);if(c.description)body.appendChild(h('p','vs-desc',c.description));row.appendChild(body);row.appendChild(btn('Test','vs-use',function(){say('/voke test '+v.url+' '+c.name,this,'Testing');}));row.appendChild(btn('Review','vs-use',function(){say('/voke '+c.url,this,'Reviewing');}));l.appendChild(row);});
  top.appendChild(l);
  const a=h('div','vs-acts');a.appendChild(btn('Publish all '+v.skills.length,'vs-btn primary',function(){say('/voke publish '+v.url,this,'Publishing');}));top.appendChild(a);
  top.appendChild(h('p','vs-note',(v.tested?'Tested. Ready to publish Public or Private.':'Public needs one test run of any skill here; Private doesn’t.')+(v.signed_in?'':' Private needs your personal Voke link.')));
  box.appendChild(top);
}
function showStatic(v){
  preview.hidden=true;statik.hidden=false;statik.innerHTML='';statik.className='vs '+(state.theme==='light'?'vs-light':'vs-dark');
  if(v.kind==='recipe'||v.kind==='bundle'){const box=h('div','vs-card');(v.kind==='recipe'?recipe:bundle)(v,box);statik.appendChild(box);}
  else if(v.kind==='status'||v.kind==='note'){const line=h('div','vs-card vs-status'),logo=h('span','vs-logo');logo.innerHTML='<svg viewBox="-15 -15 300 300" aria-hidden="true"><path d="M0 3.5H80.4L116.7 128.2 78.5 240ZM197.8 3.5H270L183.6 265H112Z"/></svg>';line.appendChild(logo);const t=h('span');t.innerHTML=v.kind==='note'?esc(v.text||''):esc(v.label||'Running')+' <b>'+esc(v.title||'')+'</b>'+(v.creator?' by @'+esc(v.creator):'');line.appendChild(t);statik.appendChild(line);}
  else{statik.hidden=true;document.body.classList.add('vk-hidden');}
  size();
}

/* ------------------------------------------------------------------ sizing + start */
let lastH=-1;
function size(){const hgt=document.body.classList.contains('vk-hidden')?0:Math.ceil(document.documentElement.getBoundingClientRect().height);if(ready&&hgt!==lastH){lastH=hgt;notify('ui/notifications/size-changed',{width:Math.ceil(document.documentElement.getBoundingClientRect().width),height:hgt});}}
if(window.ResizeObserver)new ResizeObserver(size).observe(document.body);
render();
request('ui/initialize',{appInfo:{name:'Voke',version:VERSION},appCapabilities:{availableDisplayModes:['inline']},protocolVersion:'2026-01-26'})
  .then(res=>{applyContext(res&&res.hostContext);lastH=-1;ready=true;notify('ui/notifications/initialized',{});size();})
  .catch(()=>{if(!ready){ready=true;notify('ui/notifications/initialized',{});}size();});
setTimeout(()=>{if(!ready){ready=true;size();}},1500);
// Opened outside a chat host (no tool result ever arrives): say so instead of spinning forever.
setTimeout(()=>{if(state.loading&&!state.results.length&&gen===0){state.loading=false;state.error=true;render();}},12000);
})();
</script>
